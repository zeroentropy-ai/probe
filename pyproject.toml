[project]
name = "probe-search"
version = "0.2.3"
description = "AI Agent Context Engine — give your coding agent a brain beyond code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ZeroEntropy", email = "founders@zeroentropy.dev" },
]
keywords = [
    "agent-context",
    "claude-code",
    "coding-agent",
    "mcp",
    "rag",
    "semantic-search",
    "zeroentropy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "numpy>=1.24",
    "zeroentropy>=0.1.0a1",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
cohere = ["cohere>=5.0"]
all = ["openai>=1.0", "cohere>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
probe = "probe.cli:main"

[project.urls]
Homepage = "https://www.zeroentropy.dev"
Repository = "https://github.com/zeroentropy-ai/probe"
Issues = "https://github.com/zeroentropy-ai/probe/issues"
Changelog = "https://github.com/zeroentropy-ai/probe/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.hatch.build.targets.sdist]
exclude = ["/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
