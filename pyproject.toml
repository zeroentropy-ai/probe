[project]
name = "probe-search"
version = "0.1.0"
description = "AI Agent Context Engine — give your coding agent a brain beyond code"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ZeroEntropy", email = "founders@zeroentropy.dev" },
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "numpy>=1.24",
    "zeroentropy>=0.1.0a1",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
cohere = ["cohere>=5.0"]
all = ["openai>=1.0", "cohere>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
probe = "probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
