name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: ruff check .

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test wheel in a fresh virtualenv
        run: |
          python -m venv /tmp/probe-wheel-smoke
          /tmp/probe-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/probe-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/probe-wheel-smoke/bin/probe --version
          /tmp/probe-wheel-smoke/bin/probe --help
          /tmp/probe-wheel-smoke/bin/probe mcp --help
