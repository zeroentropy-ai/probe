name: Publish to PyPI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: ruff check .

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test wheel in a fresh virtualenv
        run: |
          python -m venv /tmp/probe-wheel-smoke
          /tmp/probe-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/probe-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/probe-wheel-smoke/bin/probe --version
          /tmp/probe-wheel-smoke/bin/probe --help
          /tmp/probe-wheel-smoke/bin/probe mcp --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-status:
    name: Check PyPI version
    runs-on: ubuntu-latest
    needs: build
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - id: version
        name: Check whether this version already exists on PyPI
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          exists = False
          try:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/probe-search/json", timeout=20
              ) as response:
                  releases = json.load(response).get("releases", {})
              exists = version in releases
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          print(f"version={version}")
          print(f"exists={str(exists).lower()}")
          PY

      - name: Report PyPI status
        run: |
          if [ "${{ steps.version.outputs.exists }}" = "true" ]; then
            echo "probe-search==${{ steps.version.outputs.version }} already exists on PyPI; publish will be skipped."
          else
            echo "probe-search==${{ steps.version.outputs.version }} is new on PyPI; publish job will run."
          fi

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, pypi-status]
    if: needs.pypi-status.outputs.exists == 'false'
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
